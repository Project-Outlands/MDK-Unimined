name: Loader bump

# Outlands dispatches `outlands-release` here from its own Release.yml, after that release is verified: maven serves
# the -userdev artifact the kits compile against, and the GitHub release exists to link to. `workflow_dispatch` replays
# a version by hand.
#
# Both paths are idempotent. A version that already has a release is left alone, so replaying a release in Outlands
# (a resumed one, or a second dispatch after a red run) does not produce a second bump commit.

on:
  repository_dispatch:
    types: [outlands-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Outlands version to pin (CalVer, e.g. 2026.11.20 or 2026.11.20-2)'
        required: true

concurrency:
  # Not keyed on the ref: two loader releases in a row must queue, not cancel each other.
  group: loader-bump
  cancel-in-progress: false

jobs:
  bump:
    name: pin and release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the pin commit and the mdk/<version> tag
      actions: write    # dispatching mdk.yml, which packages and releases
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: resolve
        name: Resolve the version
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          set -euo pipefail
          # It is written into build.gradle, into a tag and into a commit message, so it is checked before any of that.
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$ ]]; then
            echo "::error::'$VERSION' is not a CalVer version (YYYY.MM.DD or YYYY.MM.DD-N)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=mdk/$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pinning the kits to Outlands $VERSION"

      - id: state
        name: Is it already released?
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already has a release, nothing to do"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            # A tag without a release is a run that died before publishing: keep the tag, still dispatch below.
            if git ls-remote --tags --refs origin "refs/tags/$TAG" | grep -q .; then
              echo "tagged=true" >> "$GITHUB_OUTPUT"
            else
              echo "tagged=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          pinned=$(sed -n 's/^ *loader "\(.*\)"$/\1/p' stacks/unimined/build.gradle | head -1)
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "pinned: $pinned"

      - uses: actions/setup-java@v6
        if: steps.state.outputs.released == 'false'
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.state.outputs.released == 'false'

      - name: Build the java kit against ${{ steps.resolve.outputs.version }}
        # The gate. A loader release that breaks the kit has to stop here, before a commit and a tag exist; the full
        # two flavor build still happens in MDK, this is the cheapest signal that the new loader is usable.
        if: steps.state.outputs.released == 'false'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: ./tool/package-flavor.sh java --build --loader "$VERSION"

      - name: Bump the pin
        if: steps.state.outputs.released == 'false' && steps.state.outputs.pinned != steps.resolve.outputs.version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          sed -i 's/^\( *\)loader ".*"$/\1loader "'"$VERSION"'"/' stacks/unimined/build.gradle
          grep -q "loader \"$VERSION\"" stacks/unimined/build.gradle
          git config user.name "outlands-release-bot"
          git config user.email "release@outlands.top"
          # [skip ci]: the tag is what gets built and released, a second full build of main is not wanted. Pushing with
          # the workflow token does not start workflows anyway, this keeps the intent readable if that ever changes.
          git commit -am "chore: Update loader to $VERSION [skip ci]"
          git push origin HEAD:main

      - name: Tag ${{ steps.resolve.outputs.tag }}
        if: steps.state.outputs.released == 'false' && steps.state.outputs.tagged == 'false'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "MDK for Outlands $VERSION"
          # The workflow token does not trigger workflows on a pushed tag, which is why MDK is dispatched explicitly
          # in the next step instead of relying on 'push: tags'.
          git push origin "refs/tags/$TAG"

      - name: Package and release the kits
        if: steps.state.outputs.released == 'false'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # workflow_dispatch is exempt from the no-recursive-workflows rule, so the workflow token is enough here.
        run: gh workflow run mdk.yml --ref main -f "version=$VERSION"

      - name: Report
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          RELEASED: ${{ steps.state.outputs.released }}
        run: |
          {
            echo "### Outlands $VERSION"
            echo
            if [ "$RELEASED" = "true" ]; then
              echo "- already released, nothing changed"
            else
              echo "- pin bumped, \`mdk/$VERSION\` tagged, MDK started to package and release"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
