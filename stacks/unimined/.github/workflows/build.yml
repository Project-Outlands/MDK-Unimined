name: Build mod jar

on:
  [workflow_dispatch, push]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
    # v6 caches through gradle-actions-caching, which is under Gradle's Terms of Use rather than MIT. Free for public
    # repositories; add `cache-provider: basic` under `with:` to stay on the MIT-only path instead.
    - uses: gradle/actions/setup-gradle@v6
      name: Set up Gradle
    - name: Add permission
      run: chmod +x ./gradlew
    - name: Execute Gradle build
      run: ./gradlew build
        
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        path: build/libs
