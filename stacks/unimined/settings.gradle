pluginManagement {
    repositories {
        // The locally published plugin (publishToMavenLocal) has to win over every mirror below, otherwise a local
        // build of Unimined is silently ignored in favour of whatever the mirror still has.
        mavenLocal()
        // Same mirrors as the project repositories (see gradle/scripts/dependencies.gradle): the plugin itself and the
        // gradle plugin portal artifacts are proxied by the jsdu mirror.
        // The mirror proxies the Outlands, Arcseekers, Forge and MCP hosts, and stays first so a plugin lookup does not
        // go to a slow origin. Unimined adds the same mirror to the project's repositories itself (see
        // OutlandsMinecraftTransformer.DEFAULT_MIRROR), which is what makes build-time downloads use it too.
        maven {
            name = 'OutlandsMirror'
            url = 'https://nexus.jsdu.cn/repository/'
        }
        maven {
            name = 'Outlands'
            url = 'https://maven.outlands.top/releases/'
        }
        gradlePluginPortal() {
            content {
                excludeGroup('org.apache.logging.log4j')
            }
        }
        mavenCentral()
        maven {
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            url = 'https://maven.wagyourtail.xyz/releases'
        }
        maven {
            url = 'https://maven.arcseekers.com/releases'
        }

        maven {
            url = 'https://maven.wagyourtail.xyz/snapshots'
        }
    }
}

plugins {
    // Automatic toolchain provisioning
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Due to an IntelliJ bug, this has to be done
// rootProject.name = archives_base_name
rootProject.name = rootProject.projectDir.getName()
